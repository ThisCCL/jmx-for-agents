subtype_acceptance:
  property: HTTPsampler.Arguments
  exact_row_type: org.apache.jmeter.protocol.http.util.HTTPArgument
  required_fields: [Argument.name, Argument.value, HTTPArgument.always_encode, HTTPArgument.content_type, Argument.metadata, HTTPArgument.use_equals]
  expected: packaged J4A read retains the exact row_type after save/reload; GUI opens the HTTP Parameters panel without class-cast or row loss

task_8_5_acceptance:
  - Open every fixture in the real JMeter 5.6.3 desktop GUI without executing the plan.
  - Exercise the named panels, make one reversible field edit on owned copies, Save As, close, reopen, and confirm tree/values/subtypes remain usable.
  - Run packaged J4A read and validate on GUI-saved copies and confirm versioned fixture hashes remain unchanged.
  - Block release on any reproducible J4A-generated structural load, panel binding, concrete value-class, save, or reopen failure.
