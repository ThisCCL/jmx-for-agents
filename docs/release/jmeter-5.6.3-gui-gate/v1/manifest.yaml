authoring_boundary:
  - The approved minimal assets omit ordinary HTTP protocol/domain/port/path scalar properties. Packaged CLI and real MCP both expose metadata but reject authoring those absent target paths with MISSING_PROPERTY.
  - The approved debug and master structures were preserved; all supported ordinary fields and structured rows were populated through J4A. `http-fields.jmx` separately proves J4A population when the exact target already contains those scalar properties.
  - The master structural conversion was not invented: the approved master Stepping Thread Group asset was used directly because J4A has no published contract for replacing the native Thread Group while preserving all children.

