assumptions_and_calculations:
  transaction_unit: one enabled HTTP Request sample equals one transaction for fixture calculations
  no_load_executed: true
  service_instances_assumed_for_template_default: 1
  master_max_threads_formula: 1 * 200 = 200, retained as ${__P(max_threads,200)}
  capacity_total_tps: 100
  capacity_mix:
    business_a: 70 percent -> 100 * 0.70 = 70 TPS
    business_b: 30 percent -> 100 * 0.30 = 30 TPS
    reversible_check: 70 + 30 = 100 percent; 70 + 30 = 100 TPS
  stability:
    N_stable: 80
    source: supplied capacity-result trace; not re-measured during fixture generation
    V_day: 900000
    V_target: 1800000
    target_formula: 2 * 900000 = 1800000
    observed_sustainable_tps: 100
    duration_formula: ceil(1800000 / 100) = 18000 seconds

operations:
  - Copy approved debug/master assets byte-for-byte, then use packaged J4A MCP components/read/apply/validate to populate supported names, methods, JMESPath assertion fields, and exact HTTPArgument rows.
  - Use packaged J4A apply/delete to derive baseline from master with only Business A.
  - Use packaged J4A apply/add/move and CLI set to derive capacity with two Throughput Controllers and set float percentages to 70.0/30.0.
  - Copy capacity, then use packaged J4A apply/set to produce the 80-thread, 18000-second stability fixture.
  - Copy the existing-property HTTP seed, then use packaged J4A apply/set/append to write protocol/domain/port/path/method and an exact HTTPArgument row.
  - Use packaged J4A init/apply/read/validate to create the core-category catalog and empty/populated Header Manager pair.

