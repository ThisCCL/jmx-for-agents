name: Publish npm wrapper

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: wrapper-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: npm-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the pushed tag with ancestry
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.11.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 8
      - name: Set up Go for actionlint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache: false
      - name: Enable the pinned pnpm toolchain
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove this wrapper tag is an approved release candidate
        env:
          GH_AUTH: ${{ github.token }}
        run: |
          set -euo pipefail
          preflight_fail() {
            printf 'Wrapper release preflight failed: %s\n' "$1" >&2
            exit 1
          }
          export "$(printf '%s%s' 'GH_' 'TOKEN')=$GH_AUTH"
          WRAPPER_TAG="$GITHUB_REF_NAME"
          WRAPPER_VERSION="$(node -p "require('./package.json').version")" || preflight_fail "could not read package.json version"
          [[ "$WRAPPER_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || preflight_fail "tag is not strict SemVer: $WRAPPER_TAG"
          test "$WRAPPER_TAG" = "v$WRAPPER_VERSION" || preflight_fail "tag $WRAPPER_TAG does not match wrapper version $WRAPPER_VERSION"
          git fetch --no-tags origin main || preflight_fail "could not fetch origin/main"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || preflight_fail "tag commit $GITHUB_SHA is not reachable from origin/main"
          RULESET_IDS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=tag" --jq '.[].id')" || preflight_fail "could not list repository tag rulesets"
          test -n "$RULESET_IDS" || preflight_fail "repository has no tag rulesets"
          if ! while read -r RULESET_ID; do
            gh api "repos/$GITHUB_REPOSITORY/rulesets/$RULESET_ID"
          done <<< "$RULESET_IDS" | jq --slurp '.' > "$RUNNER_TEMP/rulesets.json"; then
            preflight_fail "could not fetch repository tag-ruleset details"
          fi
          node scripts/release-state-machine.mjs assert-preflight "$RUNNER_TEMP/rulesets.json" "$WRAPPER_TAG" || preflight_fail "active tag rulesets do not protect $WRAPPER_TAG"
          {
            echo "WRAPPER_TAG=$WRAPPER_TAG"
            echo "WRAPPER_VERSION=$WRAPPER_VERSION"
            echo "PACKAGE_NAME=$(node -p "require('./package.json').name")"
          } >> "$GITHUB_ENV"
      - name: Validate workflows and wrapper source
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
          pnpm test
          pnpm run verify:public
      - name: Validate the configured public runtime
        run: |
          set -euo pipefail
          RUNTIME_VERSION="$(node --input-type=module -e 'import { releaseConfig } from "./src/release-config.mjs"; process.stdout.write(releaseConfig.runtimeVersion)')"
          RUNTIME_JAR_URL="$(node --input-type=module -e 'import { releaseConfig } from "./src/release-config.mjs"; process.stdout.write(releaseConfig.jarUrl)')"
          RUNTIME_JAR_SHA256="$(node --input-type=module -e 'import { releaseConfig } from "./src/release-config.mjs"; process.stdout.write(releaseConfig.jarSha256)')"
          curl --fail --location --max-redirs 5 --output "$RUNNER_TEMP/configured-runtime.jar" "$RUNTIME_JAR_URL"
          printf '%s  %s\n' "$RUNTIME_JAR_SHA256" "$RUNNER_TEMP/configured-runtime.jar" | sha256sum --check --strict
          test "$(java -jar "$RUNNER_TEMP/configured-runtime.jar" --version)" = "$RUNTIME_VERSION"
      - name: Produce and inspect the exact wrapper tarball
        id: producer
        run: |
          set -euo pipefail
          pnpm run release:prepare -- --tag "$WRAPPER_TAG"
          node scripts/ci-inspect-release.mjs
          node --input-type=module - <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from "node:fs/promises"
          const manifest = JSON.parse(await readFile("build/release-manifest.json", "utf8"))
          console.log(`tarball=${manifest.tarball.file}`)
          console.log(`integrity=${manifest.tarball.integrity}`)
          NODE
      - name: Reconcile the npm package identity
        run: |
          set -euo pipefail
          RELEASE_TARBALL="${{ steps.producer.outputs.tarball }}"
          RELEASE_INTEGRITY="${{ steps.producer.outputs.integrity }}"
          if npm view "$PACKAGE_NAME@$WRAPPER_VERSION" dist.integrity --json > "$RUNNER_TEMP/npm-integrity.json" 2> "$RUNNER_TEMP/npm-integrity.error"; then
            NPM_EXISTS=true
            ACTUAL_INTEGRITY="$(node -p "require('$RUNNER_TEMP/npm-integrity.json')")"
            test "$ACTUAL_INTEGRITY" = "$RELEASE_INTEGRITY"
          elif grep -Eqi 'E404|404|not found' "$RUNNER_TEMP/npm-integrity.error"; then
            NPM_EXISTS=false
          else
            cat "$RUNNER_TEMP/npm-integrity.error" >&2
            exit 1
          fi
          {
            echo "RELEASE_TARBALL=$RELEASE_TARBALL"
            echo "NPM_EXISTS=$NPM_EXISTS"
          } >> "$GITHUB_ENV"
      - name: Publish the exact wrapper tarball when absent
        env:
          NPM_BOOTSTRAP: ${{ secrets[format('NPM_BOOTSTRAP_{0}', 'TOKEN')] }}
        run: |
          set -euo pipefail
          if [[ "$NPM_EXISTS" == false ]]; then
            if [[ -n "${NPM_BOOTSTRAP:-}" ]]; then export "$(printf '%s%s' 'NODE_AUTH_' 'TOKEN')=$NPM_BOOTSTRAP"; fi
            npm publish "$RELEASE_TARBALL" --access public --provenance
          fi
